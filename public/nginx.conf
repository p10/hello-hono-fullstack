# Nginx static host for the output of `pnpm build` (dist/static).
#
# Usage: point `root` at the built dist/static directory and include this
# server block in your nginx configuration. The SSG build emits flat .html
# files, so clean URLs (/static-page) are mapped to /static-page.html here.
server {
    listen 80;
    server_name _;

    root /var/www/hello-hono-fullstack;  # <- the built dist/static directory
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
