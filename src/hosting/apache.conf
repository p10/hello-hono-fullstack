# Apache static host for the output of `pnpm build` (dist/static).
#
# Usage: copy this file into the built directory as `.htaccess` (requires
# AllowOverride FileInfo), or paste its contents inside a <Directory> block.
# The SSG build emits flat .html files, so clean URLs (/static-page) are mapped
# to /static-page.html here.
DirectoryIndex index.html

<IfModule mod_negotiation.c>
    # Do not let MultiViews guess /static-page on its own.
    Options -MultiViews
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME}.html -f
    RewriteRule ^(.*)$ $1.html [L]
</IfModule>
